services:
  web:
    build:
      context: .
      target: runtime
    image: radiometry:local
    command: ["python", "-m", "smp22x", "dashboard"]
    env_file:
      - path: .env
        required: false
    environment:
      SMP_DB_PATH: /app/data/acquisition.sqlite3
      SMP_API_HOST: 0.0.0.0
      SMP_API_PORT: 8050
      SMP_FRONTEND_DIR: /app/frontend/build
    ports:
      - "127.0.0.1:${SMP_API_PORT:-8050}:8050"
    volumes:
      - "${SMP_DATA_DIR:-./data}:/app/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  acquisition:
    image: radiometry:local
    build:
      context: .
      target: runtime
    command: ["python", "-m", "smp22x", "log", "--simulate", "--no-plot"]
    env_file:
      - path: .env
        required: false
    environment:
      SMP_DB_PATH: /app/data/acquisition.sqlite3
      SMP_OUT_DIR: /app/data
    volumes:
      - "${SMP_DATA_DIR:-./data}:/app/data"
    stop_grace_period: 10s
    restart: "no"
